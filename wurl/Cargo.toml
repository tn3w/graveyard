[package]
name = "wurl"
version = "0.1.0"
edition = "2024"
description = "The simplest HTTP/HTTPS client"
license = "Apache-2.0"
authors = ["tn3w <tn3w@protonmail.com>"]
repository = "https://github.com/tn3w/wurl"
documentation = "https://github.com/tn3w/wurl/blob/master/README.md"
readme = "README.md"
keywords = ["http", "https", "client", "networking", "async", "tls"]
categories = ["network-programming", "asynchronous", "http-clients"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"